name: Create Zip File
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@master
      - name: Generate ZIP
        uses: byteever/action-build-zip@master
        with:
          filename: 'OrdinarySMP.zip'
      - name: save artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: ./build/OrdinarySMP.zip
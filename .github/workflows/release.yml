name: Release Artifacts

on:
  release:
    types: [created]

jobs:
  upload-artifacts:
    name: Upload Release Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create ZIP Archive
        run: zip -r OrdinarySMP.zip assets/ pack.mcmeta pack.png

      - name: Save artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OrdinarySMP
          path: OrdinarySMP.zip

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          files: OrdinarySMP.zip

      - name: Upload to Pterodactyl
        env:
          PTERODACTYL_HOST: ${{ secrets.PTERODACTYL_HOST }}
          PTERODACTYL_SERVER_ID: ${{ secrets.PTERODACTYL_SERVER_ID }}
          PTERODACTYL_TOKEN: ${{ secrets.PTERODACTYL_TOKEN }}
          PTERODACTYL_UPLOAD_DIR: ${{ secrets.PTERODACTYL_UPLOAD_DIR }}
        run: |
          set -euo pipefail
          HOST="${PTERODACTYL_HOST%/}"
          DIR="${PTERODACTYL_UPLOAD_DIR:-/}"

          # Request a signed upload URL from the Pterodactyl Client API
          UPLOAD_URL=$(curl -fsS \
            -H "Authorization: Bearer ${PTERODACTYL_TOKEN}" \
            -H "Accept: application/json" \
            "${HOST}/api/client/servers/${PTERODACTYL_SERVER_ID}/files/upload" \
            | jq -r '.attributes.url')

          # Upload the ZIP to the target directory (overwrites an existing file)
          curl -fsS -X POST \
            -F "files=@OrdinarySMP.zip" \
            "${UPLOAD_URL}&directory=$(jq -rn --arg d "$DIR" '$d|@uri')"
